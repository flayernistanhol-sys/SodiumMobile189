buildscript {
    repositories {
        // Use the canonical Maven Central hostname; older Gradle may route
        // mavenCentral() through repo1.maven.org, which can return HTTP 403.
        maven {
            url = 'https://repo.maven.apache.org/maven2'
        }
        mavenCentral()
        maven {
            url = "https://maven.minecraftforge.net/"
        }
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:2.1-SNAPSHOT'
    }
}

apply plugin: 'net.minecraftforge.gradle.forge'

version = "0.4.0"
group = "br.com.sodiummobile"
archivesBaseName = "SodiumMobile"

minecraft {
    version = "1.8.9-11.15.1.2318-1.8.9"
    runDir = "run"
    mappings = "stable_20"
}
