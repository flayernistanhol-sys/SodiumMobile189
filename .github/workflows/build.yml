name: Build Sodium Mobile 1.8.9

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Set up Gradle 2.14.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '2.14.1'

      - name: Build Forge mod
        run: gradle --no-daemon setupDecompWorkspace build

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: SodiumMobile189-build
          path: build/libs/*.jar
          if-no-files-found: error
